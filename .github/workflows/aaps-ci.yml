name: AAPS CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag / Branch to build (tags/v3.4.2.6 or master)'
        required: true
        default: 'master'
      variant:
        description: 'Build variant (fullRelease 主机泵版本)'
        required: true
        default: 'fullRelease'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets (仅校验 KEYSTORE_SET)
        id: check_secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_SET }}" ]; then
            echo "::error::Missing secret: KEYSTORE_SET"
            exit 1
          fi
          echo "✅ Secrets check passed"

      - name: Decode & Parse KEYSTORE_SET
        id: parse_keystore
        run: |
          echo "${{ secrets.KEYSTORE_SET }}" | base64 -d > aaps.jks
          # 解析KEYSTORE_SET中的参数
          DECODED=$(echo "${{ secrets.KEYSTORE_SET }}" | base64 -d)
          KEYSTORE_PASSWORD=$(echo "$DECODED" | jq -r '.keystorePassword')
          KEY_ALIAS=$(echo "$DECODED" | jq -r '.keyAlias')
          KEY_PASSWORD=$(echo "$DECODED" | jq -r '.keyPassword')
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_OUTPUT
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_OUTPUT
        shell: bash

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Build AAPS with signature parameters
        run: |
          ./gradlew assemble${{ github.event.inputs.variant }}
        env:
          KEYSTORE_FILE: ./aaps.jks
          KEYSTORE_PASSWORD: ${{ steps.parse_keystore.outputs.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ steps.parse_keystore.outputs.KEY_ALIAS }}
          KEY_PASSWORD: ${{ steps.parse_keystore.outputs.KEY_PASSWORD }}

      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-${{ github.event.inputs.variant }}
          path: app/build/outputs/apk/**/*.apk
